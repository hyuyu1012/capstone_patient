<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrR" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrW" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrMic" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#f8fafc"/>

  <!-- Title -->
  <text x="620" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f2540">안심 케어 — 식사·복약 모니터링 시스템 아키텍처</text>
  <text x="620" y="68" text-anchor="middle" font-size="14" fill="#64748b">보호자 앱 · Firebase Firestore · 환자 앱 (YAMNet 감지 엔진 내장) · 2026-06-05</text>

  <!-- ===================== 보호자 앱 ===================== -->
  <g>
    <rect x="30" y="100" width="300" height="232" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="30" y="100" width="300" height="42" rx="14" fill="#2563eb"/>
    <text x="180" y="127" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">👨‍👩‍👧  보호자 앱</text>
    <text x="316" y="127" text-anchor="end" font-size="11" fill="#dbeafe">guardian</text>

    <g font-size="13" fill="#1f2937">
      <rect x="46" y="156" width="268" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="60" y="179">환자 등록 · 초대코드 발급</text>
      <rect x="46" y="200" width="268" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="60" y="223">약 / 식사 스케줄 등록 (time)</text>
      <rect x="46" y="244" width="268" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="60" y="267">복약 · 식사 현황 모니터링</text>
      <rect x="46" y="288" width="268" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="60" y="311">미복용(missed) 알림 수신</text>
    </g>
  </g>

  <!-- ===================== Firestore ===================== -->
  <g>
    <rect x="460" y="100" width="320" height="346" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect x="460" y="100" width="320" height="42" rx="14" fill="#d97706"/>
    <text x="620" y="127" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">☁  Firebase Firestore</text>
    <text x="766" y="127" text-anchor="end" font-size="11" fill="#fde68a">capstone-2b4a9</text>

    <!-- patients/{id} -->
    <rect x="476" y="154" width="288" height="78" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="490" y="176" font-size="13" font-weight="700" fill="#92400e">patients/{id}</text>
    <text x="490" y="196" font-size="11.5" fill="#475569">name · relation · birth · gender</text>
    <text x="490" y="214" font-size="11.5" fill="#475569">inviteCode · guardianIds · userId</text>

    <!-- schedules -->
    <rect x="476" y="244" width="288" height="96" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="490" y="266" font-size="13" font-weight="700" fill="#92400e">patients/{id}/schedules/{id}</text>
    <text x="490" y="286" font-size="11.5" fill="#475569">kind: <tspan font-weight="700">med | meal</tspan> · name · dose · time</text>
    <text x="490" y="306" font-size="11.5" fill="#475569">taken · takenAt   ← 센서가 기록</text>
    <text x="490" y="326" font-size="11.5" fill="#475569">mealStatus · detectStatus (보조 필드)</text>

    <!-- pendingMeds -->
    <rect x="476" y="352" width="288" height="78" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-dasharray="5 3"/>
    <text x="490" y="374" font-size="13" font-weight="700" fill="#92400e">patients/{id}/pendingMeds  <tspan font-size="10" fill="#b45309">(신규)</tspan></text>
    <text x="490" y="394" font-size="11.5" fill="#475569">detectStatus: unknown · needsGemini</text>
    <text x="490" y="412" font-size="11.5" fill="#475569">공백기(gap) 감지 → 보호자/Gemini 확인</text>
  </g>

  <!-- ===================== 환자 앱 ===================== -->
  <g>
    <rect x="910" y="100" width="300" height="522" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="910" y="100" width="300" height="42" rx="14" fill="#059669"/>
    <text x="1060" y="127" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">📱  환자 앱</text>
    <text x="1196" y="127" text-anchor="end" font-size="11" fill="#d1fae5">patient</text>

    <!-- UI / Firebase layer -->
    <rect x="926" y="154" width="268" height="36" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="940" y="177" font-size="12.5" fill="#1f2937">Auth 로그인 · 환자 연결(claim)</text>
    <rect x="926" y="196" width="268" height="36" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="940" y="219" font-size="12.5" fill="#1f2937">스케줄 표시 · TTS · 로컬알림</text>

    <!-- YAMNet engine panel (nested) -->
    <rect x="922" y="244" width="276" height="360" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="922" y="244" width="276" height="36" rx="12" fill="#7c3aed"/>
    <text x="1060" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">🔊 YAMNet 감지 엔진 (내장)</text>

    <rect x="938" y="292" width="244" height="34" rx="7" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="950" y="314" font-size="12" fill="#3730a3">🎙 AudioStreamer · 마이크 16kHz</text>

    <rect x="938" y="332" width="244" height="50" rx="7" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="950" y="351" font-size="11.5" fill="#3730a3">YamnetClassifier (521클래스)</text>
    <text x="950" y="370" font-size="11.5" fill="#3730a3">SwallowDetector · DrinkDetector</text>

    <rect x="938" y="388" width="244" height="50" rx="7" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="950" y="407" font-size="11.5" font-weight="700" fill="#3730a3">MedicationScorer</text>
    <text x="950" y="426" font-size="11.5" fill="#3730a3">P1 식사 · gap · P2 복약 (점수/차단)</text>

    <rect x="938" y="444" width="244" height="50" rx="7" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="950" y="463" font-size="11.5" font-weight="700" fill="#3730a3">MedResultWriter</text>
    <text x="950" y="482" font-size="11.5" fill="#3730a3">→ taken · takenAt · mealStatus</text>

    <rect x="938" y="500" width="244" height="50" rx="7" fill="#fdf4ff" stroke="#e9d5ff" stroke-dasharray="5 3"/>
    <text x="950" y="519" font-size="11.5" font-weight="700" fill="#a21caf">MedPhaseController (신규)</text>
    <text x="950" y="538" font-size="11.5" fill="#86198f">스케줄 time → setPhase(P1/P2)</text>

    <text x="1060" y="575" text-anchor="middle" font-size="11" fill="#7c3aed">▼ 입력: 씹기 · 삼킴 · 물소리 · 정지(가속도계)</text>
    <text x="1060" y="593" text-anchor="middle" font-size="10.5" fill="#94a3b8">UI는 그대로 / 엔진만 service로 결합</text>
  </g>

  <!-- ===================== 화살표 / 데이터 흐름 ===================== -->
  <!-- ① Guardian -> Firestore (write) -->
  <line x1="332" y1="182" x2="456" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="394" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">① 스케줄·환자</text>
  <text x="394" y="197" text-anchor="middle" font-size="10.5" fill="#64748b">등록 (write)</text>

  <!-- ④ Firestore -> Guardian (read) -->
  <line x1="456" y1="262" x2="334" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="394" y="280" text-anchor="middle" font-size="11.5" fill="#64748b">④ 현황 구독 (read)</text>

  <!-- ② Firestore -> Patient (read) -->
  <line x1="784" y1="182" x2="906" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="845" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">② 스케줄</text>
  <text x="845" y="197" text-anchor="middle" font-size="10.5" fill="#64748b">stream (read)</text>

  <!-- ③ Patient/YAMNet -> Firestore (write) -->
  <path d="M 920,468 C 840,468 850,330 786,310" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrW)"/>
  <text x="845" y="430" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">③ taken / takenAt</text>
  <text x="845" y="448" text-anchor="middle" font-size="10.5" fill="#7c3aed">mealStatus (write)</text>

  <!-- Mic input -->
  <rect x="946" y="660" width="228" height="56" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="1060" y="682" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">🎙 환자 생활 음향</text>
  <text x="1060" y="702" text-anchor="middle" font-size="11" fill="#0891b2">씹기 · 꿀꺽 · 물 따르기 · 약봉지</text>
  <line x1="1060" y1="658" x2="1060" y2="608" stroke="#0891b2" stroke-width="2" marker-end="url(#arrMic)"/>

  <!-- Legend -->
  <g font-size="11.5" fill="#475569">
    <rect x="30" y="688" width="14" height="14" rx="3" fill="#ffffff" stroke="#475569"/>
    <text x="50" y="699">검정 화살표 = Firestore read/write 동기화</text>
    <rect x="320" y="688" width="14" height="14" rx="3" fill="#ffffff" stroke="#7c3aed"/>
    <text x="340" y="699">보라 화살표 = 센서 감지 결과 기록 (③)</text>
    <rect x="600" y="688" width="14" height="14" rx="3" fill="#ffffff" stroke="#0891b2"/>
    <text x="620" y="699">하늘 화살표 = 마이크/센서 입력</text>
  </g>
</svg>
